[project]
name = "explorer-sparse"
version = "0.1.0"
description = "Plugin: a candidate source with its own index of BGE-M3 token weights."
requires-python = "==3.13.*"
dependencies = ["explorer"]

[tool.uv.sources]
explorer = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
