name = "bge-m3-meta-weighted"
description = "bge-m3-meta-hybrid with BM25 at half the weight of bge-m3 in the fusion, a weight fixed before any result on v1."

[chunking]
max_chars = 1000
split = "sentence"
metadata_chunk = true

[embedding]
model = "BAAI/bge-m3"
query_prefix = ""
passage_prefix = ""
dtype = "float16"
max_seq_length = 512

[lexical]
method = "BM25Okapi"
lemmatizer = "simplemma cs, en"

[strategy]
sources = ["lexical", "semantic"]
fusion = "rrf"
k = 60
chunk_pool = 200
weights = { lexical = 0.5, semantic = 1.0 }
