name = "bge-m3-meta-hybrid"
description = "bge-m3-hybrid plus a Czech and an English metadata chunk per thesis (title, keywords, abstract)."

[chunking]
max_chars = 1000
split = "sentence"
metadata_chunk = true

[embedding]
model = "BAAI/bge-m3"
query_prefix = ""
passage_prefix = ""
dtype = "float16"
max_seq_length = 512

[lexical]
method = "BM25Okapi"
lemmatizer = "simplemma cs, en"

[strategy]
sources = ["lexical", "semantic"]
fusion = "rrf"
k = 60
chunk_pool = 200
