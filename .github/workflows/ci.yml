name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Twice the budget of ten minutes (decision 0019).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      # It starts first, so the database is ready while uv installs (decision 0020).
      - name: Start the database for tests
        run: docker compose up --wait test-db

      - name: Install the workspace, the tools and the experiment dependencies
        run: uv sync --all-packages --locked

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Typecheck (basedpyright)
        run: uv run --no-sync basedpyright

      - name: Layers inside explorer (import-linter)
        run: uv run --no-sync lint-imports

      - name: Tests (pytest) with branch coverage
        run: uv run --no-sync coverage run -m pytest -m "not model" --durations=10

      # The job models reports explorer_models_local, which only its tests run.
      - name: Coverage of libs and apps
        run: uv run --no-sync coverage report --omit='libs/explorer-models-local/*'

  core-without-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Start the database for tests
        run: docker compose up --wait test-db

      - name: Install explorer alone, with the tools only
        run: uv sync --package explorer --no-default-groups --group dev --locked

      - name: No torch in the environment
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"

      - name: Every module of explorer imports
        run: >-
          uv run --no-sync python -c "import importlib, pkgutil, explorer;
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(explorer.__path__, 'explorer.')]"

      - name: Tests of explorer
        run: |
          set +e
          uv run --no-sync pytest libs/explorer -m "not model"
          code=$?
          # An empty run passes only until the core has its first test (decision 0021).
          if [ "$code" -eq 5 ] && [ -z "$(find libs/explorer -name 'test_*.py' -print -quit)" ]; then
            echo "No tests of explorer yet."
            exit 0
          fi
          exit $code

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Start the database for tests
        run: docker compose up --wait test-db

      # The reference outputs name every model and revision that the tests load (decision 0021).
      - name: Restore the models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: models-${{ hashFiles('libs/explorer-models-local/src/explorer_models_local/reference_outputs/*') }}

      - name: Install the workspace, the tools and the experiment dependencies
        run: uv sync --all-packages --locked

      # Before the tests, so the time limit of a test does not include a download.
      - name: Download the models that the reference outputs name
        if: steps.models.outputs.cache-hit != 'true' && hashFiles('libs/explorer-models-local/src/explorer_models_local/reference_outputs/*') != ''
        run: uv run --no-sync python -m explorer_models_local.download

      - name: Keep the models for the next run
        if: steps.models.outputs.cache-hit != 'true' && hashFiles('libs/explorer-models-local/src/explorer_models_local/reference_outputs/*') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: models-${{ hashFiles('libs/explorer-models-local/src/explorer_models_local/reference_outputs/*') }}

      - name: Tests with real models on the CPU
        run: |
          set +e
          uv run --no-sync coverage run -m pytest -m model --durations=10
          code=$?
          # An empty run passes only until the first model has reference outputs.
          if [ "$code" -eq 5 ] && [ ! -d libs/explorer-models-local/src/explorer_models_local/reference_outputs ]; then
            echo "No model has reference outputs yet."
            exit 0
          fi
          exit $code

      - name: Coverage of explorer_models_local
        run: uv run --no-sync coverage report --include='libs/explorer-models-local/*'

  # A released API must not break its clients (decision 0022).
  api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags and the history they are found in.
          fetch-depth: 0

      - name: The API has its specification
        run: |
          if grep -rqE '^\s*(import|from)\s+fastapi' apps/explorer-api/src && [ ! -f apps/explorer-api/openapi.json ]; then
            echo "explorer-api uses FastAPI, but apps/explorer-api/openapi.json is missing."
            exit 1
          fi

      - name: Find the specification of the last release
        id: release
        run: |
          # A tag with a suffix, such as v1.0.0-rc.1, is not a release.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release yet."
          elif ! git cat-file -e "$tag:apps/explorer-api/openapi.json" 2>/dev/null; then
            echo "Release $tag has no API specification."
          else
            git show "$tag:apps/explorer-api/openapi.json" > openapi-release.json
            echo "spec=openapi-release.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f apps/explorer-api/openapi-warn-ignore.txt ]; then
            echo "warn_ignore=apps/explorer-api/openapi-warn-ignore.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: No breaking change since the last release (oasdiff)
        if: steps.release.outputs.spec != ''
        uses: oasdiff/oasdiff-action/breaking@v0.0.57
        with:
          base: openapi-release.json
          revision: apps/explorer-api/openapi.json
          fail-on: WARN
          warn-ignore: ${{ steps.release.outputs.warn_ignore }}

  web-present:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      present: ${{ steps.find.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for the web UI
        id: find
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web UI yet."
          fi

  # It runs from the moment web/package.json exists (decision 0022).
  web:
    needs: web-present
    if: needs.web-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Start the database for tests
        working-directory: .
        run: docker compose up --wait test-db

      # The script e2e starts the API with the fake models.
      - name: Install explorer-api
        working-directory: .
        run: uv sync --package explorer-api --no-default-groups --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web UI
        run: npm ci

      - name: Lint and format (ESLint, Prettier)
        run: npm run lint

      - name: Typecheck with the client generated from openapi.json (tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests in the browser with accessibility checks (Playwright, axe)
        run: npm run e2e

  # The weekly live tests must not stop unnoticed, for example when GitHub turns the
  # schedule off after 60 days without activity (decision 0021).
  live-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
    steps:
      - name: The live tests passed within the last 8 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --limit 1 --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            echo "live.yml has not run yet."
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ]; then
            echo "live.yml has never passed."
            exit 1
          fi
          if [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt $(( 8 * 86400 )) ]; then
            echo "The last passing run of live.yml is from $last. Check that its schedule is on."
            exit 1
          fi

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Validate Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git fetch origin "${{ github.base_ref }}" --depth=50
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="-1 ${{ github.sha }}"
          fi
          pattern='^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9-]+\))?!?: .+'
          fail=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Not a conventional commit: $subject"
              fail=1
            fi
          done < <(git log --format=%s $range)
          exit $fail
