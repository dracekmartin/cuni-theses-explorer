name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install the workspace, the tools and the experiment dependencies
        run: uv sync --all-packages --locked

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Typecheck (pyright)
        run: uv run --no-sync pyright

      - name: Layers inside explorer (import-linter)
        run: uv run --no-sync lint-imports

      - name: Tests (pytest)
        run: |
          set +e
          uv run --no-sync pytest
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit $code

  core-without-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install explorer alone, with the tools only
        run: uv sync --package explorer --no-default-groups --group dev --locked

      - name: No torch in the environment
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"

      - name: Every module of explorer imports
        run: >-
          uv run --no-sync python -c "import importlib, pkgutil, explorer;
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(explorer.__path__, 'explorer.')]"

      - name: Tests of explorer
        run: |
          set +e
          uv run --no-sync pytest libs/explorer
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit $code

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Validate Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git fetch origin "${{ github.base_ref }}" --depth=50
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="-1 ${{ github.sha }}"
          fi
          pattern='^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9-]+\))?!?: .+'
          fail=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Not a conventional commit: $subject"
              fail=1
            fi
          done < <(git log --format=%s $range)
          exit $fail
