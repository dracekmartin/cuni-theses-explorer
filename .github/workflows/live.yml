name: Live services

# Tests marked network call DSpace UK and e-INFRA once a week (decision 0021), and uv audit
# looks for vulnerabilities published since the last push (decision 0024).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Start the database for tests
        run: docker compose up --wait test-db

      - name: Install the workspace, the tools and the experiment dependencies
        run: uv sync --all-packages --locked

      - name: Tests against the real services
        env:
          EXPLORER_EINFRA_API_KEY: ${{ secrets.EXPLORER_EINFRA_API_KEY }}
        run: |
          set +e
          uv run --no-sync pytest -m network --network
          code=$?
          # An empty run passes only until the first package of libs/ or apps/ calls HTTP.
          if [ "$code" -eq 5 ] && ! grep -rqE '^\s*(import|from)\s+httpx' libs/*/src apps/*/src; then
            echo "No HTTP adapter yet."
            exit 0
          fi
          exit $code

      # Also after failed tests, so each check reports on its own.
      - name: Known vulnerabilities (uv audit)
        if: ${{ !cancelled() }}
        run: uv run --no-sync python tools/check.py --audit
