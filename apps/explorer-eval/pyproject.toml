[project]
name = "explorer-eval"
version = "0.1.0"
description = "Runs search setups over an evaluation set and scores the TREC runs."
requires-python = "==3.13.*"
dependencies = ["explorer"]

[project.optional-dependencies]
local-models = ["explorer-models-local"]

[tool.uv.sources]
explorer = { workspace = true }
explorer-models-local = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

# The registry finds the in-process adapters, so deptry rejects a direct import of local-models.
[tool.deptry]
optional_dependencies_dev_groups = ["local-models"]
