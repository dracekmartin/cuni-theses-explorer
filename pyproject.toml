[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "PTH", # prefer pathlib
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["data", ".venv", "node_modules"]

# Two quality regimes (decision 0003): experiments glue untyped libraries and raw
# JSON together and stay on "standard"; application code is checked strictly.
[[tool.pyright.executionEnvironments]]
root = "apps"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "libs"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["experiments", "libs", "apps"]
addopts = "-q"
