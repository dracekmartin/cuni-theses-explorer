[tool.ruff]
target-version = "py313"
line-length = 100
# Without it, import sorting files the packages of the workspace under third-party libraries.
src = ["libs/*/src", "apps/*/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "PTH", # prefer pathlib
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# The list replaces pyright's default excludes, so .venv has to be named.
exclude = ["data", ".venv", "node_modules"]
# Two quality regimes (decision 0003): experiments glue untyped libraries and raw
# JSON together and stay on "standard", application code is checked strictly.
strict = ["libs", "apps"]

[tool.pytest.ini_options]
testpaths = ["experiments", "eval", "tools", "libs", "apps"]
# importlib lets test files in different packages share a name.
addopts = "-q --import-mode=importlib"

# Packages of the application. Experiments stay outside the workspace, their dependencies
# are a group of their own.
[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[tool.uv]
# The same minor version as the build backend uv_build, CI's setup-uv reads it too.
required-version = ">=0.13.7,<0.14"
# The lock covers the notebook and Linux (CI, the faculty cluster).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
default-groups = ["dev", "experiments"]

[tool.uv.sources]
# The notebook's driver (560.94) supports at most CUDA 12.6, CI has no GPU.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Groups pin exact versions. A tool upgrade or a new library version is a deliberate change.
[dependency-groups]
dev = [
    "deptry==0.25.1",
    "import-linter==2.15",
    "pre-commit==4.6.2",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.6",
]
# The environment that produced the reported results of the experiments.
experiments = [
    "numpy==2.5.3",
    "openai==3.19.2",
    "pypdf==6.18.0",
    "rank-bm25==0.2.2",
    "requests==2.34.2",
    "scipy==1.18.1",
    "sentence-transformers==6.0.1",
    "simplemma==2.0.0",
    "torch==2.6.0",
    "transformers==5.16.1",
]

# Layers inside explorer, following the architecture. deptry checks the dependencies between
# packages against their pyproject.toml, tools/test_plugin_imports.py checks the plugins.
# An exception in ignore_imports needs a comment with the reason.
[tool.importlinter]
root_packages = ["explorer"]

[[tool.importlinter.contracts]]
name = "Layers inside explorer"
type = "layers"
containers = ["explorer"]
# A new subpackage fails the check until it is placed in a layer.
exhaustive = true
layers = [
    "testing",
    "plugin",
    # Nothing in explorer imports the adapters, the registry finds them by name.
    "adapters",
    "overview | explanations | maps",
    "search",
    "indexes",
    "catalog | harvest | texts | models",
    "domain",
]

[[tool.importlinter.contracts]]
name = "The search core does not import the harvest"
type = "forbidden"
source_modules = ["explorer.search"]
forbidden_modules = ["explorer.harvest"]
